[workspace]
name = "large_array_viz"
version = "0.1.0"
description = "Interactive visualization of large array data in neuroscience"
authors = ["droumis"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "osx-64", "win-64"]

# Pins are the versions this notebook was built and verified against. Two are load
# bearing rather than merely current:
#   zarr is held below 3 because the OME-Zarr 0.4 sample is a Zarr 2 store and
#   xarray-ome-ngff requires zarr<3.
#   xarray supplies DataTree and open_datatree from core, so no separate datatree
#   package is involved.
[dependencies]
python = "3.12.*"
numpy = ">=2.4.6"
scipy = ">=1.18.0"
bokeh = ">=3.9.2"
panel = ">=1.9.3"
holoviews = ">=1.23.1"        # subcoordinate_y, downsample1d algorithms, scalebars
hvplot = ">=0.12.2"
datashader = ">=0.19.1"
colorcet = ">=3.2.1"
xarray = ">=2026.7.0"         # open_datatree and DataTree in core
dask = ">=2026.7.1"
zarr = ">=2.18.7,<3"
numcodecs = ">=0.15.1"
ndpyramid = ">=0.4.0"         # returns a core xr.DataTree
tsdownsample = ">=0.1.5.1"    # native LTTB and minmax-lttb used by downsample1d
fsspec = ">=2026.7.0"
aiohttp = ">=3.14.3"          # async HTTP stack for the remote Zarr read
requests = ">=2.34.2"
pooch = ">=1.9.0"
tqdm = ">=4.70.0"             # pooch download progress
h5py = ">=3.16.0"
hdf5plugin = ">=7.0.0"
jupyterlab = ">=4.6.2"
notebook = ">=7.6.1"
jupytext = ">=1.19.5"
nbconvert = ">=7.16"
nbformat = ">=5.10.4"
ipykernel = ">=7.3.0"
jupyter_bokeh = ">=4.0"       # required to render Panel objects in VS Code notebooks
virtualizarr = ">=1.2,<2"     # 2.x requires zarr 3, which conflicts with xarray-ome-ngff
kerchunk = ">=0.2.7"          # reference manifest format virtualizarr writes

# Not packaged on conda-forge.
[pypi-dependencies]
xarray-ome-ngff = ">=3.1.1"

[feature.dev.dependencies]
playwright-python = ">=1.49"

[feature.extensions.pypi-dependencies]
holonote = "*"

[environments]
default = { features = ["dev"] }
extensions = { features = ["dev", "extensions"] }

# HOLOVIZ_SKILLS points at an installed holoviz-skills collection. Override it if
# the skills live under ~/.claude/skills or ~/.copilot/skills instead.
[activation.env]
HOLOVIZ_SKILLS = "$HOME/.kilo/skills"

# --- notebook and app ---------------------------------------------------------------

[tasks]
lab = "jupyter lab large_array_viz.ipynb"
check-data = "python check_data.py"

# Development harness. Not published gallery content, see dev/README.md.
serve-views = "python -u dev/serve_views.py"
serve-app = "panel serve large_array_viz.py --dev --port 5008"
check-views = "python dev/check_views.py"
shoot-views = "python dev/shoot_views.py"
preflight = "python $HOLOVIZ_SKILLS/developing-with-holoviz/skills/panel/scripts/preflight.py large_array_viz.py check_data.py dev/serve_views.py dev/check_views.py dev/shoot_views.py"
lint-layout = "python $HOLOVIZ_SKILLS/developing-with-holoviz/skills/panel/scripts/layout_lint.py"

[tasks.serve]
cmd = "panel serve large_array_viz.ipynb --show"
description = "Serve the notebook as a standalone app"

# `--update` keeps cell ids, so the diff is limited to the cells that changed. It also keeps
# outputs, which the committed notebook does not carry, hence the clearing step.
[tasks.notebook]
cmd = "python -m jupytext --to notebook --update large_array_viz.py -o large_array_viz.ipynb && jupyter nbconvert --ClearOutputPreprocessor.enabled=True --to notebook --inplace large_array_viz.ipynb"
description = "Rebuild the .ipynb from the .py, preserving cell ids and without outputs"

# PANEL_COMMS is forced to default because Panel otherwise detects the surrounding VS Code
# process and stores ipywidget mime bundles, which do not render outside a kernel.
[tasks.verify-notebook]
cmd = "python dev/verify_notebook.py"
env = { PANEL_COMMS = "default" }
depends-on = ["notebook"]
description = "Run the notebook end to end in a temporary copy and report errors"

[tasks.clear-outputs]
cmd = "jupyter nbconvert --ClearOutputPreprocessor.enabled=True --to notebook --inplace large_array_viz.ipynb"
description = "Strip outputs from the committed notebook"
