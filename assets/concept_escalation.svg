<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" width="760" height="462" role="img" aria-label="Three tiers of reduction, cheapest first, each with what it reduces">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker>
</defs>
<rect x="0.5" y="0.5" width="759" height="461" fill="#ffffff" stroke="#b8c0c4" stroke-width="1" rx="4"/>
<text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="start" font-weight="600" font-style="normal">Start with the cheapest reduction</text>
<text x="24" y="48" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">Each tier is only needed if the one above it is not enough, and this is the order the sections below follow.</text>
<rect x="24" y="62" width="712" height="34" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
<text x="36" y="84" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="start" font-weight="600" font-style="normal">A plot has only as many pixels as its window, perhaps one or two thousand across.</text>
<rect x="24" y="112" width="712" height="84" rx="4" fill="#fbfcfc" stroke="#6b7280" stroke-width="1.2"/>
<rect x="24" y="112" width="5" height="84" fill="#0f766e" fill-opacity="1.00"/>
<text x="44" y="134" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="600" font-style="normal">1.</text>
<text x="66" y="134" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600" font-style="normal">Reduce what is sent</text>
<text x="244" y="134" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="start" font-weight="600" font-style="normal">rasterize, or downsample</text>
<text x="66" y="154" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal" font-style="normal">Aggregate to pixels, or keep a few real samples.</text>
<text x="66" y="172" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">Often enough on its own, whenever the visible window can be reduced quickly.</text>
<line x1="380.0" y1="198" x2="380.0" y2="210" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<text x="390.0" y="209" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">not enough</text>
<rect x="24" y="212" width="712" height="84" rx="4" fill="#fbfcfc" stroke="#6b7280" stroke-width="1.2"/>
<rect x="24" y="212" width="5" height="84" fill="#0f766e" fill-opacity="0.72"/>
<text x="44" y="234" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="600" font-style="normal">2.</text>
<text x="66" y="234" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600" font-style="normal">Reduce what is read</text>
<text x="244" y="234" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="start" font-weight="600" font-style="normal">a written pyramid</text>
<text x="66" y="254" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal" font-style="normal">Store several resolutions, then read the one that matches the zoom.</text>
<text x="66" y="272" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">Needed once reducing the widest view is too slow, or the data exceeds memory.</text>
<line x1="380.0" y1="298" x2="380.0" y2="310" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<text x="390.0" y="309" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">not enough</text>
<rect x="24" y="312" width="712" height="84" rx="4" fill="#fbfcfc" stroke="#6b7280" stroke-width="1.2"/>
<rect x="24" y="312" width="5" height="84" fill="#0f766e" fill-opacity="0.44"/>
<text x="44" y="334" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="600" font-style="normal">3.</text>
<text x="66" y="334" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600" font-style="normal">Reduce what is stored</text>
<text x="244" y="334" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#0f766e" text-anchor="start" font-weight="600" font-style="normal">a reference, not a copy</text>
<text x="66" y="354" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" text-anchor="start" font-weight="normal" font-style="normal">Point at chunks already in the archive instead of duplicating them.</text>
<text x="66" y="372" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="italic">Storage, not display. This tier changes nothing about what is drawn.</text>
<text x="24" y="448" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal" font-style="italic">Only the first tier is a choice between alternatives. Rasterizing and downsampling do the same job, so pick one.</text>
</svg>
